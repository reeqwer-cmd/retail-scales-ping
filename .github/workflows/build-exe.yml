name: Build Scales Monitor EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ttkbootstrap pyinstaller

      - name: Clean build folders
        shell: bash
        run: rm -rf dist build *.spec

      - name: Build Single EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --clean --name "PingScales" ping_scales.py

      - name: Create Release and Upload Single EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PingScales.exe
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
